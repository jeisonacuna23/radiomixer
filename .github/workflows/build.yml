name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > app/release.keystore
          
      - name: Decode Google Services JSON
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '\n\r ' | base64 --decode > app/google-services.json
        
      - name: Decode Firebase Service Account
        run: |
          mkdir -p app/src/main/res/raw
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | tr -d '\n\r ' | base64 --decode > app/src/main/res/raw/service_account.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioApp-Release
          path: app/build/outputs/apk/release/app-release.apk
